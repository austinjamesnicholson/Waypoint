<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141b">
<title>Waypoint — Personal Task Tracker</title>
<meta name="description" content="A personal project and task tracker that puts the right next task at the top.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Waypoint">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
/* THEME: --variables are reusable colors and spacing constants. */
:root{color-scheme:dark;--bg:#10141b;--panel:#191f29;--panel2:#222a36;--line:#303b4a;--text:#f0f4f8;--muted:#9aa8b8;--accent:#7bc5ae;--accent2:#173d36;--warn:#edb46d;--danger:#f08d91;--blue:#89b7ee;--radius:15px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}/* LAYOUT: desktop sidebar and content area. */
.app{max-width:1280px;margin:auto;min-height:100vh;display:grid;grid-template-columns:225px 1fr}.sidebar{border-right:1px solid var(--line);padding:28px 15px;position:sticky;top:0;height:100vh}.brand{font-size:24px;font-weight:800;letter-spacing:-.7px;margin:0 13px 6px}.subtitle{font-size:12px;color:var(--muted);margin:0 13px 32px}.nav{width:100%;padding:12px 15px;display:flex;align-items:center;gap:11px;background:none;border:0;border-radius:10px;color:var(--muted);text-align:left;font-weight:600;margin:3px 0}.nav.active,.nav:hover{background:var(--panel2);color:var(--text)}.count{margin-left:auto;font-size:12px;color:var(--muted)}.sidebar-foot{margin:24px 13px;font-size:12px;color:var(--muted);line-height:1.7}.main{min-width:0;padding:35px 37px 96px}/* HEADER: shared header on each view; actions have fixed sizing. */
.top{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:24px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:1.6px;font-size:11px;font-weight:750}.title{font-size:29px;letter-spacing:-.7px;margin:6px 0}.sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0}.btn{border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 13px;background:var(--panel2);white-space:nowrap}.btn:hover{filter:brightness(1.14)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#0c211a;font-weight:750}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.btn.small{font-size:12px;padding:7px 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}
/* Header buttons do not move when a page title or subtitle gets longer. */
.top-actions{display:grid;grid-template-columns:minmax(102px,1.7fr) minmax(84px,1fr) minmax(76px,1fr);gap:8px;flex:0 0 auto;align-items:stretch}
.top-actions .btn{width:100%;text-align:center}
.top-actions .task-action{font-size:15px;padding:12px 16px;min-height:44px;font-weight:800}
.top-actions .secondary-action{font-size:12px;padding:8px 9px;min-height:36px;align-self:center}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:25px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px}.metric strong{display:block;font-size:27px;margin:6px 0}.metric span{color:var(--muted);font-size:12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 12px}.section-head h2{font-size:17px;margin:0}.section-head small{color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.field,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 11px;min-width:0}.field{width:100%}select{max-width:100%}textarea{resize:vertical;min-height:86px;width:100%}input[type=date]{color-scheme:dark}.search{max-width:310px;flex:1}.list{display:flex;flex-direction:column;gap:9px}.task{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:14px;display:flex;align-items:start;gap:12px}.task:hover{border-color:#4a5c69}.task-main{flex:1;min-width:0;cursor:pointer}.task-title{font-weight:650;font-size:15px;margin:0 0 6px;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}.next{font-size:13px;color:#d3dce5;margin:9px 0 0;line-height:1.45}.rank{color:var(--muted);background:var(--panel2);width:27px;height:27px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;font-size:12px}.pill{font-size:11px;padding:4px 7px;border-radius:6px;background:var(--panel2);color:var(--muted);display:inline-block}.pill.high{color:#f1a1a4;background:#44262d}.pill.normal{color:#d6c18b;background:#3d3827}.pill.low{color:#a7b6c5;background:#2c3440}.pill.waiting{color:var(--warn)}.pill.done{color:var(--accent)}.checkbox{accent-color:var(--accent);width:16px;height:16px;margin:5px 0 0;cursor:pointer;flex-shrink:0}.empty{border:1px dashed var(--line);color:var(--muted);border-radius:12px;text-align:center;padding:35px 20px;line-height:1.6}.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.project{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:17px;cursor:pointer;text-align:left;color:var(--text)}.project:hover{border-color:var(--accent)}.project h3{font-size:17px;margin:4px 0 8px}.progress{background:#374250;border-radius:8px;height:5px;margin-top:13px;overflow:hidden}.progress div{height:100%;background:var(--accent)}.filter-summary{font-size:12px;color:var(--muted);margin:5px 0 13px}.notice{border-left:3px solid var(--warn);background:#2c2925;padding:10px 14px;color:#eac9a4;border-radius:4px;font-size:13px;margin:12px 0}/* MODALS: floating forms for Quick Capture, task editing, and projects. */
.dialog-backdrop{position:fixed;inset:0;z-index:20;background:#05070bbd;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{max-height:min(90vh,900px);overflow:auto;width:min(660px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:23px}.dialog h2{font-size:22px;margin:0 0 6px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.group{display:flex;flex-direction:column;gap:6px;min-width:0}.group label{font-size:12px;font-weight:650;color:var(--muted)}.group.full{grid-column:1/-1}.dialog-actions{display:flex;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap}.dialog-actions>div{display:flex;gap:8px}.hint{color:var(--muted);font-size:12px;line-height:1.5;margin:10px 0}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:3px}.mobile-nav{display:none}.details-inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.secondary-panel{background:var(--panel);padding:14px;border-radius:12px;border:1px solid var(--line);margin-top:14px}.muted{color:var(--muted)}.hidden{display:none!important}/* MOBILE: a dedicated, stable action row below the title on all screens. */
@media(max-width:820px){.top{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:stretch}.top-actions{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr);width:100%;gap:7px}.top-actions .task-action{padding:12px 9px}.top-actions .secondary-action{padding:9px 5px;font-size:11px}.top>.top-heading{min-width:0}.app{display:block}.sidebar{display:none}.main{padding:24px 17px 105px}.top{align-items:center}.title{font-size:25px}.metrics{grid-template-columns:repeat(2,1fr)}.project-grid{grid-template-columns:1fr}.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#191f29f5;border-top:1px solid var(--line);padding:9px 5px calc(11px + env(safe-area-inset-bottom))}.mobile-nav button{background:none;border:0;color:var(--muted);font-size:11px;display:grid;gap:4px;place-items:center}.mobile-nav button.active{color:var(--accent)}.mobile-nav b{font-size:20px;font-weight:500}.dialog{padding:18px;max-height:91vh}.form-grid{grid-template-columns:1fr}.group.full{grid-column:auto}.search{max-width:none}.top .btn{padding:9px}.top-actions .task-action{padding:12px 9px}.top-actions .secondary-action{padding:9px 5px}}@media(max-width:370px){.task{padding:11px}.pill{font-size:10px}.metric{padding:12px}}
@media (display-mode: standalone){.main{padding-top:calc(25px + env(safe-area-inset-top))}.dialog-backdrop{padding-top:calc(20px + env(safe-area-inset-top))}} 
@media(max-width:820px){input,select,textarea{font-size:16px}} 
</style>
</head>
<!-- HTML SHELL: #app receives rendered pages; #modal-root receives dialogs. -->
<body><div id="app" class="app"></div><div id="modal-root"></div><input id="import-file" class="hidden" type="file" accept="application/json,.json"><script>
/* APP LOGIC: this IIFE keeps the app variables out of global scope. */
(()=>{'use strict';
// STORAGE: preserving this key preserves existing saved tasks on the device.
const KEY='waypoint.tasks.v1', TODAY=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
// DATA MODEL: common values that appear in the task and project forms.
const statuses=['Not Started','In Progress','Waiting','Completed','Canceled'];
const priorities=['High','Normal','Low'];
const categories=['Hobbies','Home','Automotive','Woodworking','Software','Life Admin','Personal Development','Other'];
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);
const initial=()=>({version:1,projects:[],tasks:[],categories:[...categories]});
// STORAGE: load the database from localStorage or initialize empty records.
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.tasks)&&Array.isArray(x.projects))return {...initial(),...x};}catch(e){}return initial()}
let db=load(), view='dashboard', search='', statusFilter='open', projectFilter='', categoryFilter='', typeFilter='', dialog=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Unable to save locally. Try exporting a backup.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const project=id=>db.projects.find(p=>p.id===id);
const category=t=>t.category||project(t.projectId)?.category||'Inbox';
const type=t=>t.type||project(t.projectId)?.type||'Want';
const priorityOrder={High:0,Normal:1,Low:2};
const dateKey=s=>s||'9999-12-31';
// RANKING: next step date, then priority, then target finish date.
// Blank dates go last; creation time settles remaining ties.
function cmp(a,b){return dateKey(a.nextDate).localeCompare(dateKey(b.nextDate))||(priorityOrder[a.priority]??1)-(priorityOrder[b.priority]??1)||dateKey(a.dueDate).localeCompare(dateKey(b.dueDate))||a.createdAt.localeCompare(b.createdAt)}
const inactive=t=>['Completed','Canceled','Waiting'].includes(t.status)||['Paused','Someday','Completed','Canceled'].includes(project(t.projectId)?.status);
const inbox=t=>!t.category&&!t.projectId;
const ready=t=>!inactive(t)&&!inbox(t);
const fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:undefined}):'No date';
const relative=s=>s&&s<TODAY()?'Overdue':s===TODAY()?'Today':fmtDate(s);
const count=(fn)=>db.tasks.filter(fn).length;
// RENDERING: these functions generate HTML strings from application data.
function navItem(id,icon,name,n){return `<button class="nav ${view===id?'active':''}" data-view="${id}"><span>${icon}</span>${name}${n!==undefined?`<span class="count">${n}</span>`:''}</button>`}
function base(title,sub,content){document.getElementById('app').innerHTML=`<aside class="sidebar"><h1 class="brand">◈ Waypoint</h1><div class="subtitle">Personal projects & tasks</div>${navItem('dashboard','⌂','Dashboard')}${navItem('projects','▦','Projects',db.projects.filter(p=>p.status==='Active').length)}${navItem('tasks','☷','All tasks',count(t=>!['Completed','Canceled'].includes(t.status)))}${navItem('inbox','◫','Inbox',count(inbox))}<div class="sidebar-foot">Sort: Next step date → Priority → Due date<br><br>Saved locally in this browser.</div></aside><main class="main"><header class="top"><div class="top-heading"><div class="eyebrow">Waypoint / ${esc(view==='dashboard'?'Overview':view)}</div><h1 class="title">${esc(title)}</h1><p class="sub">${sub}</p></div><div class="top-actions"><button class="btn primary task-action" data-action="newTask">+ Task</button><button class="btn secondary-action" data-action="newProject">+ Project</button><button class="btn secondary-action" data-action="menu">⚙ Backup</button></div></header>${content}</main><nav class="mobile-nav">${[['dashboard','⌂','Home'],['projects','▦','Projects'],['tasks','☷','Tasks'],['inbox','◫','Inbox']].map(([id,i,n])=>`<button data-view="${id}" class="${view===id?'active':''}"><b>${i}</b>${n}</button>`).join('')}</nav>`}
function taskCard(t,i){const p=project(t.projectId);const done=t.status==='Completed';return `<article class="task"><input type="checkbox" class="checkbox" ${done?'checked':''} data-complete="${esc(t.id)}" aria-label="Complete ${esc(t.title)}"><div class="task-main" data-edit-task="${esc(t.id)}" role="button" tabindex="0"><div class="task-title" style="${done?'text-decoration:line-through;opacity:.6':''}">${esc(t.title)}</div><div class="meta"><span>${esc(p?.name||category(t))}</span><span>·</span><span class="pill ${t.priority.toLowerCase()}">${esc(t.priority)}</span><span class="pill">${esc(type(t))}</span>${t.status==='Waiting'?'<span class="pill waiting">Waiting</span>':''}${done?'<span class="pill done">Completed</span>':''}</div>${t.nextStep?`<p class="next">↳ ${esc(t.nextStep)}</p>`:''}<div class="details-inline"><span class="pill">Next: ${esc(relative(t.nextDate))}</span><span class="pill">Due: ${esc(relative(t.dueDate))}</span>${t.blocker?'<span class="pill waiting">⚠ Blocker</span>':''}</div></div>${i!==undefined?`<div class="rank">${i+1}</div>`:''}</article>`}
function taskList(ts,empty='Nothing here yet.') {return ts.length?`<div class="list">${ts.map((t,i)=>taskCard(t,i)).join('')}</div>`:`<div class="empty">${empty}</div>`}
// SCREENS: each view uses base() so the navigation and header stay consistent.
function dashboard(){let ranked=db.tasks.filter(ready).sort(cmp), waiting=db.tasks.filter(t=>t.status==='Waiting'), upcoming=db.tasks.filter(t=>ready(t)&&t.nextDate&&t.nextDate>TODAY());base('What should I work on?','Your tasks are ranked automatically. Dates are targets, not availability gates.',`<div class="metrics"><div class="metric"><span>Ready to work on</span><strong>${ranked.length}</strong></div><div class="metric"><span>Waiting</span><strong>${waiting.length}</strong></div><div class="metric"><span>Unsorted inbox</span><strong>${count(inbox)}</strong></div><div class="metric"><span>Active projects</span><strong>${db.projects.filter(p=>p.status==='Active').length}</strong></div></div><div class="section-head"><h2>Ranked work queue</h2><small>Next step date → Priority → Due date</small></div>${taskList(ranked,'No ranked tasks yet. Add a task or organize your inbox to get started.')}<div class="section-head"><h2>Needs attention</h2></div><div class="secondary-panel"><div class="meta">${count(inbox)} inbox · ${waiting.length} waiting · ${upcoming.length} with future next-step targets</div><div class="actions" style="margin-top:12px"><button class="btn small" data-view="inbox">Organize inbox</button><button class="btn small" data-action="showWaiting">View waiting</button></div></div>`)}
function projectCard(p){let ts=db.tasks.filter(t=>t.projectId===p.id),done=ts.filter(t=>t.status==='Completed').length,percent=ts.length?Math.round(done/ts.length*100):0;return `<button class="project" data-project="${esc(p.id)}"><div class="meta">${esc(p.category||'Uncategorized')} · <span class="pill">${esc(p.status)}</span></div><h3>${esc(p.name)}</h3><div class="meta">${ts.length} tasks · ${done} completed · ${p.dueDate?`Target ${fmtDate(p.dueDate)}`:'No target date'}</div><div class="progress"><div style="width:${percent}%"></div></div></button>`}
function projectsView(){base('Projects','Organize bigger goals into tasks. Standalone tasks remain independent.',`<div class="toolbar"><button class="btn primary" data-action="newProject">+ New project</button></div>${db.projects.length?`<div class="project-grid">${[...db.projects].sort((a,b)=>a.name.localeCompare(b.name)).map(projectCard).join('')}</div>`:'<div class="empty">No projects yet. Create one to group related work.</div>'}`)}
function projectDetail(){let p=project(projectFilter);if(!p){view='projects';return projectsView()}let ts=db.tasks.filter(t=>t.projectId===p.id).sort(cmp);base(p.name,`${esc(p.category||'Uncategorized')} · ${esc(p.status)} · ${ts.length} tasks`, `<div class="actions"><button class="btn ghost" data-view="projects">← All projects</button><button class="btn" data-edit-project="${esc(p.id)}">Edit project</button><button class="btn primary" data-add-to-project="${esc(p.id)}">+ Task in project</button></div>${p.description?`<p class="sub" style="margin-top:15px">${esc(p.description)}</p>`:''}<div class="section-head"><h2>Project tasks</h2><small>Same ranking rules</small></div>${taskList(ts,'Add your first task to this project.')}`)}
function allTasks(){let ts=[...db.tasks].sort(cmp).filter(t=>{if(statusFilter==='open'&&['Completed','Canceled'].includes(t.status))return false;if(statusFilter==='waiting'&&t.status!=='Waiting')return false;if(statusFilter==='completed'&&t.status!=='Completed')return false;if(statusFilter==='ready'&&!ready(t))return false;if(categoryFilter&&category(t)!==categoryFilter)return false;if(typeFilter&&type(t)!==typeFilter)return false;return !search||[t.title,t.description,t.nextStep,t.blocker,project(t.projectId)?.name].join(' ').toLowerCase().includes(search.toLowerCase())});let opts=(arr,sel)=>arr.map(([value,label])=>`<option value="${esc(value)}" ${sel===value?'selected':''}>${esc(label)}</option>`).join('');base('All tasks','Full inventory, including standalone tasks and tasks within projects.',`<div class="toolbar"><input id="search" class="field search" placeholder="Search tasks…" value="${esc(search)}" aria-label="Search tasks"><select id="statusFilter" aria-label="Filter by status">${opts([['open','All open'],['ready','Ranked / ready'],['waiting','Waiting'],['completed','Completed'],['all','All statuses']],statusFilter)}</select><select id="categoryFilter" aria-label="Filter category">${opts([['','All categories'],['Inbox','Inbox'],...db.categories.map(x=>[x,x])],categoryFilter)}</select><select id="typeFilter" aria-label="Filter need or want">${opts([['','Need & Want'],['Need','Need'],['Want','Want']],typeFilter)}</select></div><div class="filter-summary">${ts.length} matching tasks · Ranked by next step date, priority, then due date</div>${taskList(ts,'No tasks match these filters.')}`)}
function inboxView(){base('Inbox','Quickly capture ideas, then give them a category or project when you are ready.',`<div class="toolbar"><button class="btn primary" data-action="quickCapture">+ Quick capture</button></div>${taskList(db.tasks.filter(inbox).sort(cmp),'Your inbox is clear. Quick-captured tasks will appear here.')}`)}
function draw(){if(view==='dashboard')dashboard();else if(view==='projects')projectsView();else if(view==='project')projectDetail();else if(view==='tasks')allTasks();else inboxView()}
const field=(name,label,value='',type='text',extra='')=>`<div class="group ${extra}"><label for="f_${name}">${label}</label><input class="field" id="f_${name}" name="${name}" type="${type}" value="${esc(value)}"></div>`;
const selectField=(name,label,options,value='',extra='')=>`<div class="group ${extra}"><label for="f_${name}">${label}</label><select name="${name}" id="f_${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
const textArea=(name,label,value='',extra='')=>`<div class="group ${extra}"><label for="f_${name}">${label}</label><textarea name="${name}" id="f_${name}">${esc(value)}</textarea></div>`;
// FULL TASK EDITOR: use this for task details, planning, and updates.
function openTask(id=null,pid=null){let t=db.tasks.find(x=>x.id===id)||{title:'',description:'',projectId:pid||'',category:'',type:'',priority:'Normal',status:'Not Started',nextStep:'',nextDate:'',dueDate:'',deadline:'',blocker:'',waitingFor:'',followUpDate:'',effort:''};dialog={type:'task',id};const ps=[['','Standalone'],...db.projects.map(p=>[p.id,p.name])];const cats=[['','Inherit from project / Inbox'],...db.categories.map(x=>[x,x])];showModal(`${id?'Edit task':'New task'}`,`<form id="item-form" class="form-grid">${field('title','Task title',t.title,'text','full')}${selectField('projectId','Project',ps,t.projectId)}${selectField('category','Category',cats,t.category)}${selectField('type','Need / Want',[['','Inherit (Want by default)'],['Need','Need'],['Want','Want']],t.type)}${selectField('priority','Priority',priorities.map(x=>[x,x]),t.priority)}${selectField('status','Status',statuses.map(x=>[x,x]),t.status)}${field('nextDate','Next step target date',t.nextDate,'date')}${field('dueDate','Task target finish date',t.dueDate,'date')}${field('deadline','Hard deadline (optional)',t.deadline,'date')}${field('effort','Estimated effort (minutes)',t.effort,'number')}${textArea('nextStep','Next step',t.nextStep,'full')}${textArea('description','Description / notes',t.description,'full')}${textArea('blocker','Blocker (if any)',t.blocker,'full')}${field('waitingFor','Waiting for',t.waitingFor)}${field('followUpDate','Follow-up date',t.followUpDate,'date')}<div class="group full"><p class="hint">Ranking is automatic: earliest next step target date, then High → Normal → Low priority, then earliest task due date. Undated tasks come last.</p></div></form>`,id)}
// QUICK CAPTURE: just one field, saved to Inbox. Detailed planning can happen later.
function openQuickCapture(){
 dialog={type:'quick'};
 showModal('Quick capture',`<form id="item-form" class="form-grid">
 ${field('title','What do you want to remember?','','text','full')}
 <p class="hint" style="grid-column:1/-1">Just enter a title. You can organize it and set dates later.</p>
 </form>`,null);
}
function openProject(id=null){let p=db.projects.find(x=>x.id===id)||{name:'',description:'',category:'Hobbies',type:'Want',priority:'Normal',status:'Active',dueDate:''};dialog={type:'project',id};showModal(`${id?'Edit project':'New project'}`,`<form id="item-form" class="form-grid">${field('name','Project name',p.name,'text','full')}${selectField('category','Category',db.categories.map(x=>[x,x]),p.category)}${selectField('type','Need / Want',[['Need','Need'],['Want','Want']],p.type)}${selectField('status','Project status',['Active','Paused','Someday','Completed','Canceled'].map(x=>[x,x]),p.status)}${field('dueDate','Target finish date',p.dueDate,'date')}${textArea('description','Description / notes',p.description,'full')}</form>`,id)}
function showModal(title,form,id){document.getElementById('modal-root').innerHTML=`<div class="dialog-backdrop" id="backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><div class="top" style="margin-bottom:18px"><div><h2 id="dialogtitle">${esc(title)}</h2><p class="sub">Changes save to this browser.</p></div><button class="btn small" data-action="close">✕ Close</button></div>${form}<div class="dialog-actions"><div>${id?`<button class="btn danger" data-action="delete">Delete</button>`:''}</div><div><button class="btn ghost" data-action="close">Cancel</button><button class="btn primary" data-action="save">Save</button></div></div></section></div>`;document.querySelector('#item-form input[name="title"],#item-form input[name="name"]')?.focus()}
function close(){dialog=null;document.getElementById('modal-root').innerHTML=''}
function saveDialog(){if(!dialog)return;const form=document.getElementById('item-form');const values=Object.fromEntries(new FormData(form).entries());const now=new Date().toISOString();const name=(dialog.type==='task'||dialog.type==='quick'?values.title:values.name).trim();if(!name){alert('Please enter a name.');return}if(dialog.type==='quick'){
 // Save deliberately unorganized: category and project are blank, so Inbox lists it.
 db.tasks.push({id:uid(),title:name,description:'',projectId:'',category:'',type:'',priority:'Normal',
 status:'Not Started',nextStep:'',nextDate:'',dueDate:'',deadline:'',blocker:'',
 waitingFor:'',followUpDate:'',effort:'',createdAt:now,updatedAt:now});
 view='inbox';
}else if(dialog.type==='task'){let existing=db.tasks.find(t=>t.id===dialog.id);let item={...existing,...values,title:name,effort:values.effort?Number(values.effort):'',id:existing?.id||uid(),createdAt:existing?.createdAt||now,updatedAt:now};if(!existing){db.tasks.push(item)}else{db.tasks=db.tasks.map(t=>t.id===dialog.id?item:t)}if(item.status==='Completed'&&!item.completedAt)item.completedAt=now;else if(item.status!=='Completed')item.completedAt=null}else{let existing=db.projects.find(p=>p.id===dialog.id);let item={...existing,...values,name,id:existing?.id||uid(),createdAt:existing?.createdAt||now,updatedAt:now};if(!existing)db.projects.push(item);else db.projects=db.projects.map(p=>p.id===dialog.id?item:p)}save();close();draw()}
function deleteDialog(){if(!dialog||!confirm(`Delete this ${dialog.type}? This cannot be undone.`))return;if(dialog.type==='task'){db.tasks=db.tasks.filter(t=>t.id!==dialog.id)}else{if(db.tasks.some(t=>t.projectId===dialog.id)&&!confirm('This project has tasks. Keep them as standalone tasks? (Cancel leaves everything unchanged)'))return;db.tasks.forEach(t=>{if(t.projectId===dialog.id)t.projectId=''});db.projects=db.projects.filter(p=>p.id!==dialog.id);view='projects'}save();close();draw()}
// BACKUP: JSON download keeps task data portable, despite local-only storage.
function exportData(){let json=JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2);let url=URL.createObjectURL(new Blob([json],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='waypoint-backup-'+TODAY()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function menu(){document.querySelector('#backup-panel')?.remove();let el=document.createElement('div');el.id='backup-panel';el.className='secondary-panel';el.innerHTML=`<div class="section-head"><h2>Data & backup</h2></div><p class="hint">Data stays in this browser and does not automatically sync between devices. Export a backup regularly. Import replaces the current data.</p><div class="actions"><button class="btn small" data-action="export">Export JSON backup</button><button class="btn small" data-action="import">Import JSON backup</button><button class="btn small danger" data-action="clear">Reset all data</button></div>`;document.querySelector('.main')?.append(el)}
// EVENTS: one listener handles interactions on dynamically rendered screens.
window.addEventListener('click',e=>{let b=e.target.closest('[data-view],[data-action],[data-project],[data-edit-task],[data-edit-project],[data-add-to-project],[data-complete]');if(!b){if(e.target.id==='backdrop')close();return}if(b.dataset.view){view=b.dataset.view;draw();return}if(b.dataset.editTask){openTask(b.dataset.editTask);return}if(b.dataset.project){projectFilter=b.dataset.project;view='project';draw();return}if(b.dataset.editProject){openProject(b.dataset.editProject);return}if(b.dataset.addToProject){openTask(null,b.dataset.addToProject);return}if(b.dataset.complete){let t=db.tasks.find(t=>t.id===b.dataset.complete);if(t){t.status=e.target.checked?'Completed':'Not Started';t.completedAt=e.target.checked?new Date().toISOString():null;t.updatedAt=new Date().toISOString();save();draw()}return}switch(b.dataset.action){case 'newTask':openTask();break;case 'quickCapture':openQuickCapture();break;case 'newProject':openProject();break;case 'close':close();break;case 'save':saveDialog();break;case 'delete':deleteDialog();break;case 'showWaiting':statusFilter='waiting';view='tasks';draw();break;case 'export':exportData();break;case 'import':document.getElementById('import-file').click();break;case 'clear':if(confirm('Permanently reset all locally saved tasks and projects?')){db=initial();save();view='dashboard';draw()}break;case 'menu':menu();break;}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog)close();if((e.key==='Enter'||e.key===' ')&&e.target.dataset.editTask){e.preventDefault();openTask(e.target.dataset.editTask)}});
window.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;allTasks();let x=document.getElementById('search');x?.focus();x?.setSelectionRange(pos,pos)}});
window.addEventListener('change',e=>{if(e.target.id==='statusFilter'){statusFilter=e.target.value;draw()}if(e.target.id==='categoryFilter'){categoryFilter=e.target.value;draw()}if(e.target.id==='typeFilter'){typeFilter=e.target.value;draw()}});
document.getElementById('import-file').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.tasks)||!Array.isArray(data.projects))throw Error('Not a valid backup');if(!confirm('Import this backup and replace all currently saved data?'))return;db={...initial(),...data};save();view='dashboard';draw()}catch(err){alert('Import failed: '+err.message)}e.target.value=''});
// FIRST PAINT: render the default screen using loaded data.
draw();
})();
</script>
<script>
// PWA: register offline caching on supported HTTPS hosts.
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(console.warn));
}
</script>
</body></html>
